<div class="card">
    <div class="card-body">
        <div class="text-center mb-4">
            {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}" class="rounded-circle" width="100" height="100" alt="Profile">
            {% else %}
                <div class="rounded-circle bg-secondary d-inline-flex align-items-center justify-content-center" style="width: 100px; height: 100px;">
                    <i class="fas fa-user fa-2x text-white"></i>
                </div>
            {% endif %}
            <h5 class="mt-3">{{ user.get_full_name }}</h5>
            <p class="text-muted">Account: {{ account.account_number }}</p>
        </div>
        
        <div class="list-group">
            <a href="{% url 'customer_dashboard' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
            </a>
            <a href="{% url 'deposit' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-plus-circle me-2"></i>Deposit
            </a>
            <a href="{% url 'withdrawal' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-minus-circle me-2"></i>Withdraw
            </a>
            <a href="{% url 'transfer' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-exchange-alt me-2"></i>Transfer
            </a>
            <a href="{% url 'transaction_history' %}" class="list-group-item list-group-item-action active">
                <i class="fas fa-history me-2"></i>Transaction History
            </a>
            <a href="{% url 'profile' %}" class="list-group-item list-group-item-action">
                <i class="fas fa-user-edit me-2"></i>Profile
            </a>
        </div>
    </div>
</div>
